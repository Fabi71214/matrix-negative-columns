name: Automated Testing and Code Quality

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code inspection with flake8
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run unit, integration and regression tests with coverage (>=80%)
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Run regression tests explicitly
        run: pytest tests/test_regression.py -v
